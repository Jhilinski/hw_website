server {
    server_name hilinskiworld.duckdns.org www.hilinskiworld.duckdns.org;
    client_max_body_size 1G;  # or more depending on your needs
	
	location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_buffering off;
        proxy_cache off;
	}



    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hilinskiworld.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hilinskiworld.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.hilinskiworld.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = hilinskiworld.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name hilinskiworld.duckdns.org www.hilinskiworld.duckdns.org;
    return 404; # managed by Certbot


}
