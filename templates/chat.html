{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Chat</h2>
    <div id="chat-container" style="border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: scroll;">
        {% if messages %}
            {% for message in messages %}
            <p><strong>{{ message.sender.username }}</strong> ({{ message.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}): {{ message.message }}</p>
            {% endfor %}
        {% else %}
            <p>No messages found.</p>
        {% endif %}
    </div>
    <form id="chat-form" style="margin-top: 10px;">
        <div class="input-group">
            <input type="text" id="message-input" class="form-control" placeholder="Type a message..." required>
            <div class="input-group-append">
                <button type="submit" class="btn btn-primary">Send</button>
            </div>
        </div>
    </form>
</div>

<script>
    // SSE for receiving messages
    const source = new EventSource('/stream');
    source.onmessage = function(event) {
        const data = JSON.parse(event.data);
        console.log('Received message:', data);
        const chatContainer = document.getElementById('chat-container');
        const messageElement = document.createElement('p');
        messageElement.innerHTML = `<strong>${data.username}</strong> (${data.timestamp}): ${data.message}`;
        chatContainer.appendChild(messageElement);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    };
    source.onerror = function() {
        console.error('SSE error');
    };

    // AJAX for sending messages
    document.getElementById('chat-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const messageInput = document.getElementById('message-input');
        const message = messageInput.value.trim();
        if (message) {
            console.log('Sending message:', message);
            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `message=${encodeURIComponent(message)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    console.log('Message sent:', data);
                    messageInput.value = '';
                } else {
                    console.error('Error sending message:', data.error);
                }
            })
            .catch(error => console.error('Fetch error:', error));
        }
    });
</script>
{% endblock %}
